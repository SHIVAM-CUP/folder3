<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic AI Attendance & Geofence System</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 20px; margin: 0; }
        .container { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        #video-container { position: relative; width: 100%; max-width: 400px; margin: 15px auto; }
        video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); }
        .status-msg { font-weight: bold; margin-top: 10px; }
        .success { color: green; font-weight: bold; margin-top: 15px; }
        .error { color: red; font-weight: bold; margin-top: 15px; }
        .preview-img { width: 100%; max-width: 200px; border-radius: 10px; margin-top: 10px; border: 2px solid #28a745; }
        
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .btn-admin { background: #28a745; }
        .btn-history { background: #17a2b8; }

        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 450px; text-align: left; max-height: 80vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { background: #dc3545; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>📷 Automatic AI Attendance & Geofence</h2>
    <p id="status-info" style="color: blue;">AI Models Load Ho Rahe Hain...</p>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <button class="btn btn-admin" onclick="openAdminAuth()">➕ Register Student</button>
    <button class="btn btn-history" onclick="showHistoryModal()">📜 View History Logs</button>

    <canvas id="hidden-canvas" width="400" height="300" style="display:none;"></canvas>
    <div id="result"></div>
    <div id="geo-status" class="status-msg" style="color: #555;"></div>
</div>

<!-- History Log Modal -->
<div id="history-modal" class="modal">
    <div class="modal-content">
        <h3>📜 Attendance & Exit Logs History</h3>
        <div id="history-table-container"></div>
        <button class="btn close-btn" onclick="closeModal('history-modal')">Close</button>
    </div>
</div>

<!-- Admin Password Modal -->
<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h3>🔒 Admin Password Required</h3>
        <div class="form-group">
            <label>Admin Password:</label>
            <input type="password" id="admin-pass-input" placeholder="Enter password">
        </div>
        <p id="auth-error" class="error" style="display:none; font-size:12px;"></p>
        <button class="btn" onclick="verifyAdminPassword()">Verify & Open Form</button>
        <button class="btn close-btn" onclick="closeModal('auth-modal')">Cancel</button>
    </div>
</div>

<!-- Registration Modal -->
<div id="register-modal" class="modal">
    <div class="modal-content">
        <h3>📝 Student Registration</h3>
        <div class="form-group">
            <label>Student ID:</label>
            <input type="text" id="reg-id" placeholder="e.g. STU101">
        </div>
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="reg-name" placeholder="e.g. Rahul Sharma">
        </div>
        <div class="form-group">
            <label>Parent Mobile No (SMS):</label>
            <input type="text" id="reg-parent" placeholder="e.g. 919876543210">
        </div>
        <p id="reg-msg" class="status-msg" style="font-size: 13px;"></p>
        <button class="btn btn-admin" onclick="captureAndRegisterStudent()">Scan Face & Register</button>
        <button class="btn close-btn" onclick="closeModal('register-modal')">Close</button>
    </div>
</div>

<script>
    const CONFIG = {
        allowedLat: 26.944020,
        allowedLng: 81.092274,
        allowedRadius: 5000,
        modelUrl: 'https://justadudewhohacks.github.io/face-api.js/models',
        fast2SmsApiKey: 'L3ubCJQetAhofnq7wGyvKdrpVgOH0D5WzIUMXSmYl4Zsx68Ei17wxec3fKGEXmJtbQzAhiRZkpML2UT4',
        cloudinaryPreset: '176173983799991PRESET_NAME_dzxw4vxpj',
        cloudinaryCloudName: 'dzxw4vxpj',
        adminPassword: 'admin123'
    };

    let globalStream = null;
    let activeStudentId = '';
    let activeStatus = '';
    let extraMessageInfo = '';
    let faceDetectionInterval = null;
    let watchGeoId = null;
    let isInsideGeofence = true;

    function getRegisteredStudents() {
        return JSON.parse(localStorage.getItem('registered_students_db')) || {};
    }

    function saveRegisteredStudents(data) {
        localStorage.setItem('registered_students_db', JSON.stringify(data));
    }

    function addHistoryLog(studentId, name, status, timeStr, dateStr, extraNote = '') {
        let history = JSON.parse(localStorage.getItem('attendance_history_logs')) || [];
        history.unshift({ studentId, name, status, timeStr, dateStr, extraNote });
        localStorage.setItem('attendance_history_logs', JSON.stringify(history));
    }

    Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.modelUrl),
        faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.modelUrl),
        faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.modelUrl)
    ]).then(() => startCamera())
    .catch(err => {
        document.getElementById('status-info').innerHTML = `<b class="error">❌ AI Models Load Fail: ${err.message}</b>`;
    });

    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                globalStream = stream;
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    detectAndMatchFaceContinuously();
                };
            })
            .catch(() => {
                document.getElementById('status-info').innerHTML = '<b class="error">❌ Camera Access Fail!</b>';
            });
    }

    function openAdminAuth() {
        document.getElementById('admin-pass-input').value = '';
        document.getElementById('auth-error').style.display = 'none';
        document.getElementById('auth-modal').style.display = 'block';
    }

    function verifyAdminPassword() {
        const inputPass = document.getElementById('admin-pass-input').value;
        if (inputPass === CONFIG.adminPassword) {
            closeModal('auth-modal');
            document.getElementById('reg-msg').innerHTML = '';
            document.getElementById('register-modal').style.display = 'block';
        } else {
            document.getElementById('auth-error').innerText = '❌ Incorrect Password!';
            document.getElementById('auth-error').style.display = 'block';
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function showHistoryModal() {
        const history = JSON.parse(localStorage.getItem('attendance_history_logs')) || [];
        let container = document.getElementById('history-table-container');
        if(history.length === 0) {
            container.innerHTML = '<p>Koi History Records Nahi Hain.</p>';
        } else {
            let html = `<table><tr><th>ID</th><th>Name</th><th>Status</th><th>Time</th><th>Date</th><th>Note</th></tr>`;
            history.forEach(log => {
                html += `<tr><td>${log.studentId}</td><td>${log.name}</td><td><b>${log.status}</b></td><td>${log.timeStr}</td><td>${log.dateStr}</td><td>${log.extraNote}</td></tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
        }
        document.getElementById('history-modal').style.display = 'block';
    }

    async function captureAndRegisterStudent() {
        const id = document.getElementById('reg-id').value.trim();
        const name = document.getElementById('reg-name').value.trim();
        const parent = document.getElementById('reg-parent').value.trim();
        const regMsg = document.getElementById('reg-msg');
        const video = document.getElementById('video');

        if (!id || !name || !parent) {
            regMsg.innerHTML = '<span class="error">⚠️ Sabhi fields bharna zaroori hai!</span>';
            return;
        }

        regMsg.innerHTML = '<span style="color:blue;">🔍 Chehra scan ho raha hai...</span>';
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 });
        const detection = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
            regMsg.innerHTML = '<span class="error">❌ Chehra nahi mila!</span>';
            return;
        }

        const db = getRegisteredStudents();
        db[id] = { id, name, parent, descriptor: Array.from(detection.descriptor) };
        saveRegisteredStudents(db);
        regMsg.innerHTML = `<span class="success">✅ Student ${name} registered!</span>`;

        setTimeout(() => { closeModal('register-modal'); location.reload(); }, 1500);
    }

    async function detectAndMatchFaceContinuously() {
        const video = document.getElementById('video');
        const statusInfo = document.getElementById('status-info');
        const registeredDB = getRegisteredStudents();
        const studentKeys = Object.keys(registeredDB);

        if (studentKeys.length === 0) {
            statusInfo.innerHTML = '<b class="error">❌ Koi Student Register Nahi Hai!</b>';
            return;
        }

        const labeledDescriptors = studentKeys.map(key => {
            const student = registeredDB[key];
            return new faceapi.LabeledFaceDescriptors(student.id, [new Float32Array(student.descriptor)]);
        });

        const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
        statusInfo.innerText = '🔍 Camera Ke Samne Aayein, AI Pehchan Kar Raha Hai...';

        faceDetectionInterval = setInterval(async () => {
            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 });
            const detection = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

            if (detection) {
                const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                if (bestMatch.label !== 'unknown') {
                    clearInterval(faceDetectionInterval);
                    activeStudentId = bestMatch.label;
                    statusInfo.innerHTML = `<b style="color:green;">✅ Chehra Pehchana Gaya: ${registeredDB[activeStudentId].name} (${activeStudentId})</b>`;
                    verifyInitialLocationAndProcess();
                } else {
                    statusInfo.innerHTML = '<b class="error">❌ Unregistered Chehra!</b>';
                }
            }
        }, 1000);
    }

    function verifyInitialLocationAndProcess() {
        const result = document.getElementById('result');
        if (!navigator.geolocation) {
            processAttendanceAndSMS();
            return;
        }

        result.innerHTML = '<p style="color: blue;">Location check ho rahi hai...</p>';
        navigator.geolocation.getCurrentPosition(
            position => {
                const distance = calculateDistance(position.coords.latitude, position.coords.longitude, CONFIG.allowedLat, CONFIG.allowedLng);
                if (distance <= CONFIG.allowedRadius) {
                    processAttendanceAndSMS();
                    startContinuousGeofenceMonitoring();
                } else {
                    result.innerHTML = '<p class="error">❌ Access Denied! Allowed Location Ke Bahar Hain.</p>';
                }
            },
            () => {
                processAttendanceAndSMS();
                startContinuousGeofenceMonitoring();
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    // UPDATED GEOFENCE MONITORING LOGIC
    function startContinuousGeofenceMonitoring() {
        if (!navigator.geolocation) return;

        isInsideGeofence = true;
        const geoStatusElem = document.getElementById('geo-status');
        geoStatusElem.innerHTML = '<span style="color:green;">📡 Continuous Live Geofence Monitoring Active...</span>';

        watchGeoId = navigator.geolocation.watchPosition(
            position => {
                const distance = calculateDistance(position.coords.latitude, position.coords.longitude, CONFIG.allowedLat, CONFIG.allowedLng);

                if (distance > CONFIG.allowedRadius && isInsideGeofence) {
                    isInsideGeofence = false;
                    
                    // Check student current state before triggering Auto-EXIT
                    let currentStatus = localStorage.getItem(`last_type_${activeStudentId}`);

                    // Agar student pehle se EXIT kar chuka hai, toh Auto-EXIT trigger NAHI hoga
                    if (currentStatus === 'EXIT' || currentStatus === 'AUTO_EXIT') {
                        geoStatusElem.innerHTML = '<span style="color:blue;">ℹ️ Student already scanned and EXITED. Geofence alert bypassed.</span>';
                        return;
                    }

                    // Agar bina face-scan (sirf ENTRY state me tha) aur bahar gaya, tabhi alert jayega
                    geoStatusElem.innerHTML = '<span class="error">🚨 Boundary exit detected without face scan! Sending Auto-EXIT SMS...</span>';
                    
                    const now = new Date();
                    localStorage.setItem(`last_type_${activeStudentId}`, 'AUTO_EXIT');
                    localStorage.setItem(`last_time_${activeStudentId}`, now.getTime());

                    const registeredDB = getRegisteredStudents();
                    addHistoryLog(activeStudentId, registeredDB[activeStudentId].name, 'AUTO_EXIT', now.toLocaleTimeString(), now.toISOString().split('T')[0], 'Bina Scan kiye Bahar Gaya');

                    triggerAutoExitSMS();
                } else if (distance <= CONFIG.allowedRadius) {
                    isInsideGeofence = true;
                }
            },
            err => console.warn('GPS Tracking Error:', err.message),
            { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
    }

    function triggerAutoExitSMS() {
        const registeredDB = getRegisteredStudents();
        const student = registeredDB[activeStudentId];
        if (!student) return;

        const currentTime = new Date().toLocaleTimeString();
        const today = new Date().toISOString().split('T')[0];
        const uniqueToken = Math.floor(1000 + Math.random() * 9000);

        const messageText = `ALERT: Student ${student.name} (${activeStudentId}) left allowed location WITHOUT FACE SCAN at ${currentTime} on ${today}. Code: ${uniqueToken}`;
        const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${CONFIG.fast2SmsApiKey}&route=v3&sender_id=TXTIND&message=${encodeURIComponent(messageText)}&language=english&flash=0&numbers=${student.parent}`;

        fetch(url, { method: 'GET' })
            .then(res => res.json())
            .then(response => {
                const geoStatusElem = document.getElementById('geo-status');
                if (response.return) {
                    geoStatusElem.innerHTML += '<br><span class="success">✅ Geofence Exit Auto-SMS Sent!</span>';
                }
            });
    }

    // PROCESS ATTENDANCE LOGIC
    function processAttendanceAndSMS() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('hidden-canvas');
        const context = canvas.getContext('2d');
        const result = document.getElementById('result');

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (globalStream) { globalStream.getTracks().forEach(track => track.stop()); }
        document.getElementById('video-container').style.display = 'none';

        const photoDataUrl = canvas.toDataURL('image/jpeg');
        const photoNumber = `IMG-${Date.now()}-${Math.floor(1000 + Math.random() * 9000)}`;
        const registeredDB = getRegisteredStudents();
        const student = registeredDB[activeStudentId];

        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const lastTypeKey = `last_type_${activeStudentId}`;
        const lastTimeKey = `last_time_${activeStudentId}`;
        const lastDateKey = `last_date_${activeStudentId}`;

        let lastType = localStorage.getItem(lastTypeKey);
        let lastTime = parseInt(localStorage.getItem(lastTimeKey)) || 0;
        let lastDate = localStorage.getItem(lastDateKey);

        extraMessageInfo = '';

        // Conditions check:
        if (lastDate && lastDate !== todayStr) {
            // Naye Din ka Scan -> ENTRY
            activeStatus = 'ENTRY';
            extraMessageInfo = ' (Fresh Day Entry)';
        } else if (lastType === 'ENTRY') {
            // Agar pehle se ENTRY hai -> To ab EXIT mark hoga
            activeStatus = 'EXIT';
            if (lastTime > 0) {
                extraMessageInfo = ` Total Time Spent: ${formatDuration(now.getTime() - lastTime)}`;
            }
        } else {
            // Agar last status EXIT / AUTO_EXIT tha -> To ab ENTRY hoga
            activeStatus = 'ENTRY';
            if (lastType === 'AUTO_EXIT') {
                extraMessageInfo = ' (Re-Entry After Unscanned Exit)';
            }
        }

        // Save new status
        localStorage.setItem(lastTypeKey, activeStatus);
        localStorage.setItem(lastTimeKey, now.getTime());
        localStorage.setItem(lastDateKey, todayStr);

        addHistoryLog(activeStudentId, student.name, activeStatus, now.toLocaleTimeString(), todayStr, extraMessageInfo);

        result.innerHTML = `
            <p class="success">✅ Attendance Marked Successfully (${activeStatus})</p>
            <img src="${photoDataUrl}" class="preview-img"><br>
            <p><b>Student:</b> ${student.name} (${activeStudentId})</p>
            <p id="upload-status" style="color: blue;">Photo upload ho rahi hai aur SMS bheja ja raha hai...</p>
        `;

        uploadPhotoAndSendSMS(photoDataUrl, student, photoNumber);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + 
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatDuration(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return `${h > 0 ? h + 'h ' : ''}${m}m ${s}s`;
    }

    function uploadPhotoAndSendSMS(photoDataUrl, student, photoNumber) {
        const formData = new FormData();
        formData.append('file', photoDataUrl);
        formData.append('upload_preset', CONFIG.cloudinaryPreset);

        fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudinaryCloudName}/image/upload`, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => sendAttendanceSMS(student, photoNumber, data.secure_url || 'Link unavailable'))
            .catch(() => sendAttendanceSMS(student, photoNumber, 'Link unavailable'));
    }

    function sendAttendanceSMS(student, photoNumber, photoLink) {
        const today = new Date().toISOString().split('T')[0];
        const currentTime = new Date().toLocaleTimeString();
        const uniqueToken = Math.floor(1000 + Math.random() * 9000);
        const messageText = `Attendance Verified. ID: ${activeStudentId}, Name: ${student.name}, Status: ${activeStatus}${extraMessageInfo}, Time: ${currentTime}, Code: ${uniqueToken}-${today}, Photo: ${photoLink}`;

        const url = `https://www.fast2sms.com/dev/bulkV2?authorization=${CONFIG.fast2SmsApiKey}&route=v3&sender_id=TXTIND&message=${encodeURIComponent(messageText)}&language=english&flash=0&numbers=${student.parent}`;

        fetch(url, { method: 'GET' })
            .then(res => res.json())
            .then(response => {
                const statusElem = document.getElementById('upload-status');
                if (statusElem) {
                    statusElem.innerHTML = response.return 
                        ? '<span class="success">➔ Photo Uploaded & Automatic SMS Sent!</span>' 
                        : `<span class="error">❌ SMS Error: ${response.message}</span>`;
                }
            });
    }
</script>
</body>
</html>
